<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Danh sách sản phẩm</h2>
        <a th:href="@{/products/add}" class="btn btn-primary">+ Thêm sản phẩm mới</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Danh mục</th>
                    <th>Ảnh</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${p.category?.name ?: 'Chưa phân loại'}"></td>
                    <td>
                        <div th:if="${p.imgUrl != null and !#strings.isEmpty(p.imgUrl)}">
                            <img th:src="@{/${p.imgUrl}}"
                                 class="img-thumbnail"
                                 style="max-width: 120px; height: auto; object-fit: cover;"
                                 alt="${p.name}"
                                 onerror="this.onerror=null; this.src='/images/no-image.png';">
                        </div>
                        <div th:unless="${p.imgUrl != null and !#strings.isEmpty(p.imgUrl)}">
                            <span class="text-muted fst-italic">Chưa có ảnh</span>
                        </div>
                    </td>
                    <td>
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning me-1">Sửa</a>
                        <a th:href="@{/products/delete/{id}(id=${p.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Xác nhận xóa sản phẩm này?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center py-4 text-muted">Chưa có sản phẩm nào trong danh sách</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
