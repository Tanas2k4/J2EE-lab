<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4">Sửa thông tin sản phẩm</h3>
            <form th:action="@{/products/save}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{imgUrl}"/>

                <div class="mb-3">
                    <label class="form-label">Tên sản phẩm</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Giá (VNĐ)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" required min="0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ảnh hiện tại</label><br>
                    <div th:if="${product.imgUrl != null and !#strings.isEmpty(product.imgUrl)}">
                        <img th:src="@{/uploads/${product.imgUrl}}"
                             class="img-thumbnail"
                             style="max-width: 220px; height: auto;"
                             alt="Ảnh hiện tại"
                             onerror="this.onerror=null; this.src='/images/no-image.png';">
                    </div>
                    <div th:unless="${product.imgUrl != null and !#strings.isEmpty(product.imgUrl)}">
                        <p class="text-muted">Chưa có ảnh sản phẩm</p>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Thay ảnh mới (nếu cần)</label>
                    <input type="file" name="file" class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label class="form-label">Danh mục</label>
                    <select name="category.id" class="form-select" required>
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${product.category != null and product.category.id == c.id}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-warning">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
