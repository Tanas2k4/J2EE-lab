<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">

<head>
    <title>Create Product</title>
</head>

<body>
<div layout:fragment="content">

    <h2 class="mb-4">Add Product</h2>

    <form th:action="@{/products/create}"
          th:object="${newProduct}"
          method="post"
          enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input th:field="*{name}" class="form-control">
            <small class="text-danger"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" th:field="*{price}" class="form-control">
            <small class="text-danger"
                   th:if="${#fields.hasErrors('price')}"
                   th:errors="*{price}"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file" name="imageProduct" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{category.id}" class="form-select">
                <option th:each="c : ${listCategory}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
        </div>

        <button class="btn btn-success">Save</button>
        <a th:href="@{/products}" class="btn btn-secondary">Back</a>
    </form>

</div>
</body>
</html>
