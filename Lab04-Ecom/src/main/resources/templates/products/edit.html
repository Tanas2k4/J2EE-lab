<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">

<head>
    <title>Edit Product</title>
</head>

<body>
<div layout:fragment="content">

    <h2 class="mb-4">Edit Product</h2>

    <form th:action="@{/products/edit}"
          th:object="${editProduct}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number" th:field="*{price}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Image</label>
            <input type="file" name="imageProduct" class="form-control">
        </div>

        <div class="mb-3">
            <label>Category</label>
            <select th:field="*{category.id}" class="form-select">
                <option th:each="c : ${listCategory}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
        </div>

        <button class="btn btn-primary">Update</button>
        <a th:href="@{/products}" class="btn btn-secondary">Back</a>

    </form>

</div>
</body>
</html>
